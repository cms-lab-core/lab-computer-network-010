<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="430" viewBox="0 0 1350 430"><rect width="1350" height="430" fill="white"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202124}.n{fill:#fff;stroke:#5f6368;stroke-width:3}.l{stroke:#747b83;stroke-width:5}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:17px;fill:#5f6368}.u{fill:#1a73e8}</style><text class="h" x="675" y="55" text-anchor="middle">UDP: одна datagram, без handshake</text><line class="l" x1="390" y1="205" x2="960" y2="205"/><rect class="n" x="120" y="135" width="270" height="145" rx="22"/><rect class="n" x="960" y="135" width="270" height="145" rx="22"/><text class="t" x="255" y="190" text-anchor="middle">pc1</text><text class="s" x="255" y="225" text-anchor="middle">10.10.0.10</text><text class="t" x="1095" y="190" text-anchor="middle">pc2</text><text class="s" x="1095" y="225" text-anchor="middle">UDP :9000</text><rect class="u" x="555" y="170" width="240" height="70" rx="12"/><text x="675" y="198" text-anchor="middle" fill="white">src port → dst 9000</text><text x="675" y="225" text-anchor="middle" fill="white">length · checksum · payload</text><text class="s" x="675" y="345" text-anchor="middle">Нет SYN/ACK, sequence, retransmission или connection state в UDP header.</text></svg>